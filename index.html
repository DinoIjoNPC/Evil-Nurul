<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untuk Nurul 9B</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #1a0000;
            color: #ff3333;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }
        
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(255, 0, 0, 0.05) 1px, transparent 1px);
            background-size: 100% 4px;
            z-index: -2;
            pointer-events: none;
        }
        
        .glitch-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            z-index: -1;
            pointer-events: none;
            opacity: 0.5;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }
        
        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            border-bottom: 3px solid #ff3333;
            position: relative;
        }
        
        @keyframes titleGlitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        .glitch-title {
            font-size: 3.5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #ff0000;
            text-shadow: 3px 3px 0 #800000, 6px 6px 0 #400000;
            margin-bottom: 10px;
            animation: titleGlitch 0.5s infinite;
        }
        
        .subtitle {
            font-size: 1.5rem;
            color: #ff6666;
            margin-bottom: 30px;
        }
        
        .main-button {
            display: block;
            margin: 30px auto;
            padding: 18px 40px;
            background-color: #ff0000;
            color: #1a0000;
            border: none;
            border-radius: 0;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 5px 0 #800000, 0 10px 15px rgba(255, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .main-button:hover {
            background-color: #ff3333;
            transform: translateY(-5px);
            box-shadow: 0 10px 0 #800000, 0 15px 20px rgba(255, 0, 0, 0.4);
        }
        
        .main-button:active {
            transform: translateY(0);
            box-shadow: 0 5px 0 #800000, 0 8px 10px rgba(255, 0, 0, 0.3);
        }
        
        .main-button::after {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: rotate(45deg);
            animation: buttonShine 3s infinite;
        }
        
        @keyframes buttonShine {
            0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
            100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
        }
        
        .message-container {
            background-color: rgba(40, 0, 0, 0.9);
            border: 2px solid #ff3333;
            padding: 30px;
            margin: 30px 0;
            min-height: 250px;
            position: relative;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.8s, transform 0.8s;
        }
        
        .message-container.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        .message-container::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(transparent 65%, rgba(255, 0, 0, 0.05) 75%, transparent 85%);
            pointer-events: none;
            z-index: 1;
        }
        
        .message-text {
            font-size: 1.8rem;
            line-height: 1.6;
            color: #ff6666;
            min-height: 150px;
            font-weight: bold;
        }
        
        .typing-cursor {
            display: inline-block;
            width: 10px;
            height: 2rem;
            background-color: #ff3333;
            margin-left: 5px;
            animation: blink 1s infinite;
            vertical-align: middle;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        
        .next-button {
            display: none;
            margin: 20px auto;
            padding: 15px 30px;
            background-color: #990000;
            color: #ff9999;
            border: 2px solid #ff3333;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s, transform 0.5s, background-color 0.3s;
        }
        
        .next-button.show {
            opacity: 1;
            transform: scale(1);
            display: block;
        }
        
        .next-button:hover {
            background-color: #cc0000;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.7);
        }
        
        .next-button.glitch {
            animation: glitchEffect 0.3s infinite;
            background-color: #330000;
            color: #ff0000;
            border-color: #ff0000;
        }
        
        @keyframes glitchEffect {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        .photo-container {
            display: none;
            text-align: center;
            margin: 40px 0;
            padding: 20px;
            background-color: rgba(20, 0, 0, 0.9);
            border: 3px solid #ff3333;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 1s, transform 1s;
        }
        
        .photo-container.show {
            opacity: 1;
            transform: scale(1);
            display: block;
        }
        
        .photo-container img {
            max-width: 100%;
            border: 2px solid #990000;
            filter: sepia(100%) hue-rotate(-30deg) contrast(120%);
        }
        
        .photo-title {
            font-size: 2rem;
            color: #ff3333;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .apology-button {
            display: none;
            margin: 30px auto;
            padding: 20px 40px;
            background: linear-gradient(to bottom, #ff3333, #990000);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.8rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.5);
            text-decoration: none;
            text-align: center;
            width: fit-content;
            opacity: 0;
            transform: translateY(20px);
        }
        
        .apology-button.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }
        
        .apology-button:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(255, 0, 0, 0.7);
            background: linear-gradient(to bottom, #ff6666, #cc0000);
        }
        
        .apology-button i {
            margin-right: 10px;
        }
        
        .fade-out {
            animation: fadeOut 1.5s forwards;
        }
        
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
        
        footer {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
            color: #660000;
            font-size: 0.9rem;
            border-top: 1px solid #330000;
        }
        
        @keyframes bloodDrip {
            0% { transform: translateY(-100px) rotate(15deg); opacity: 0; }
            10% { opacity: 1; }
            100% { transform: translateY(100vh) rotate(15deg); opacity: 0; }
        }
        
        .blood-drip {
            position: fixed;
            width: 4px;
            height: 100px;
            background: linear-gradient(to bottom, rgba(255, 0, 0, 0.8), rgba(128, 0, 0, 0.4));
            z-index: 0;
            pointer-events: none;
            opacity: 0;
        }
        
        @media (max-width: 768px) {
            .glitch-title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .main-button {
                font-size: 1.5rem;
                padding: 15px 30px;
            }
            
            .message-text {
                font-size: 1.5rem;
            }
        }
        
        .music-indicator {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: rgba(255, 0, 0, 0.2);
            color: #ff6666;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 0.8rem;
            z-index: 1000;
            display: none;
            border: 1px solid #ff3333;
        }
    </style>
</head>
<body>
    <audio id="bgMusic" loop>
        <source src="https://www.dropbox.com/scl/fi/g552v182ljb3e7qusenz5/TikTok-Downloader-Without-Watermark-MP3-Story-Image-Online-FREE-1768904212.mp3?rlkey=mbgizfz7mks9b62nd4xxid8zh&st=2shaknt0&dl=1" type="audio/mpeg">
    </audio>

    <div class="music-indicator" id="musicIndicator">KLIK TOMBOL BUKA UNTUK MEMULAI</div>
    
    <div class="glitch-overlay"></div>
    
    <div class="container">
        <header>
            <h1 class="glitch-title">BUAT NURUL 9D</h1>
            <p class="subtitle">"Sebuah Pesan yang Tak Pernah Diinginkan"</p>
        </header>
        
        <button class="main-button" id="openBtn">BUKA</button>
        
        <div class="message-container" id="messageContainer">
            <div class="message-text" id="messageText"></div>
            <span class="typing-cursor" id="typingCursor" style="display: none;"></span>
        </div>
        
        <button class="next-button" id="nextBtn">NEXT</button>
        
        <div class="photo-container" id="photoContainer">
            <h2 class="photo-title">Lihat Kesalahan Mu!</h2>
            <img id="displayedPhoto" alt="Foto Kesalahan">
        </div>
        
        <a href="https://wa.me/+6282351667537?text=Maaf+Kan+Saya+Dino😢" target="_blank" class="apology-button" id="apologyBtn">
            <i class="fas fa-heart-crack"></i> Minta Maaf
        </a>
        
        <footer>
            <p>© 2025 - Pesan ini Khusus Nurul 9D!</p>
            <p>Maaf Ku Itu Serius! Bukan Bercanda!</p>
        </footer>
    </div>

    <script>
        // SISTEM AUDIO - Hanya aktif saat tombol BUKA ditekan
        const bgMusic = document.getElementById('bgMusic');
        const musicIndicator = document.getElementById('musicIndicator');
        let audioStarted = false;
        
        function startAudio() {
            if (!audioStarted) {
                bgMusic.volume = 0.7;
                bgMusic.play()
                    .then(() => {
                        audioStarted = true;
                        musicIndicator.style.display = 'none';
                        console.log("Audio aktif setelah tombol BUKA");
                        
                        // Efek visual konfirmasi audio
                        document.body.style.animation = "glitchEffect 0.1s 3";
                        setTimeout(() => {
                            document.body.style.animation = "";
                        }, 300);
                    })
                    .catch(error => {
                        console.log("Gagal memutar audio:", error);
                        musicIndicator.textContent = "AUDIO GAGAL - KLIK LAGI";
                        musicIndicator.style.display = 'block';
                        musicIndicator.style.animation = "glitchEffect 0.5s infinite";
                        musicIndicator.style.backgroundColor = "rgba(255, 0, 0, 0.5)";
                    });
            }
        }
        
        // Tampilkan indikator musik saat halaman dimuat
        window.addEventListener('load', function() {
            musicIndicator.style.display = 'block';
            musicIndicator.textContent = "KLIK TOMBOL 'BUKA' UNTUK MEMULAI";
        });
        
        // DATA DAN FUNGSI UTAMA
        const messages = [
            "Saya Benci Kau, Benci Kau",
            "Saya Meminta Maaf Dengan Nya Secara Baik Baik",
            "Hadiah Ini Untuk Mu",
            "Hadiah Kebencian Ku Terhadap Mu",
            "Bla Bla Bla, Kau Tidak Mengerti Maaf",
            "Saya Meminta Maaf Dengan Baik",
            "Namun Kamu Berkata Jahat (Nurul)",
            "Apa Salahnya Meminta Maaf?",
            "Tidak Bercanda Saya Kalo Minta Maaf!",
            "Kau Bisa Minta Maaf Dengan Hati Lembut?",
            "Tidak Lucu!",
            "Lihat Kesalahan Mu!"
        ];
        
        const openBtn = document.getElementById('openBtn');
        const messageContainer = document.getElementById('messageContainer');
        const messageText = document.getElementById('messageText');
        const typingCursor = document.getElementById('typingCursor');
        const nextBtn = document.getElementById('nextBtn');
        const photoContainer = document.getElementById('photoContainer');
        const displayedPhoto = document.getElementById('displayedPhoto');
        const apologyBtn = document.getElementById('apologyBtn');
        
        let currentMessageIndex = 0;
        let isTyping = false;
        let textIndex = 0;
        let typingSpeed = 50;
        let pageInitialized = false;
        
        const photoUrl = "https://www.dropbox.com/scl/fi/law3vuqwgieqsjbhc9k1n/Screenshot_2026_0120_175516.jpg?rlkey=ne4sma10knrwvh3ssxd27uno9&st=6brjrae8&dl=1";
        
        // FUNGSI TOMBOL BUKA - PERBAIKAN
        openBtn.addEventListener('click', function() {
            if (!pageInitialized) {
                // 1. Mulai audio
                startAudio();
                
                // 2. Sembunyikan tombol BUKA dengan efek
                openBtn.style.transform = "scale(0)";
                openBtn.style.opacity = "0";
                setTimeout(() => {
                    openBtn.style.display = "none";
                }, 300);
                
                // 3. Tampilkan container pesan dengan efek
                messageContainer.classList.add('show');
                
                // 4. Tampilkan tombol NEXT dengan efek
                setTimeout(() => {
                    nextBtn.classList.add('show');
                }, 500);
                
                // 5. Mulai mengetik pesan pertama
                setTimeout(() => {
                    typeText();
                }, 800);
                
                pageInitialized = true;
                console.log("Halaman diinisialisasi");
            }
        });
        
        // Fungsi mengetik teks
        function typeText() {
            if (isTyping || currentMessageIndex >= messages.length) return;
            
            isTyping = true;
            textIndex = 0;
            messageText.textContent = "";
            typingCursor.style.display = "inline-block";
            
            const currentMessage = messages[currentMessageIndex];
            
            const typeInterval = setInterval(() => {
                if (textIndex < currentMessage.length) {
                    messageText.textContent += currentMessage.charAt(textIndex);
                    textIndex++;
                } else {
                    clearInterval(typeInterval);
                    isTyping = false;
                    
                    // Sembunyikan kursor setelah selesai mengetik
                    setTimeout(() => {
                        typingCursor.style.display = "none";
                        
                        // Jika ini pesan terakhir, aktifkan efek glitch
                        if (currentMessageIndex === messages.length - 1) {
                            nextBtn.textContent = "LIHAT KESALAHAN";
                            nextBtn.classList.add("glitch");
                            document.body.style.animation = "glitchEffect 0.2s infinite";
                            createBloodDrips();
                        }
                    }, 1000);
                }
            }, typingSpeed);
        }
        
        // Fungsi efek darah menetes
        function createBloodDrips() {
            for (let i = 0; i < 15; i++) {
                const drip = document.createElement('div');
                drip.classList.add('blood-drip');
                const leftPos = Math.random() * 100;
                drip.style.left = `${leftPos}vw`;
                const delay = Math.random() * 10;
                drip.style.animation = `bloodDrip ${3 + Math.random() * 5}s ease-in ${delay}s forwards`;
                document.body.appendChild(drip);
                
                setTimeout(() => {
                    if (drip.parentNode) {
                        drip.parentNode.removeChild(drip);
                    }
                }, 15000);
            }
            
            const bloodInterval = setInterval(() => {
                if (currentMessageIndex === messages.length - 1) {
                    createBloodDrips();
                } else {
                    clearInterval(bloodInterval);
                }
            }, 3000);
        }
        
        // Fungsi fade out pesan
        function fadeOutMessage() {
            messageContainer.classList.add("fade-out");
            nextBtn.classList.remove("show");
            
            setTimeout(() => {
                messageContainer.classList.remove("fade-out");
                messageContainer.classList.remove("show");
                
                // Jika ini pesan terakhir, tampilkan foto
                if (currentMessageIndex === messages.length - 1) {
                    document.body.style.animation = "";
                    displayedPhoto.src = photoUrl;
                    
                    // Tampilkan foto dengan efek
                    setTimeout(() => {
                        photoContainer.classList.add('show');
                    }, 300);
                    
                    // Tampilkan tombol minta maaf dengan efek
                    setTimeout(() => {
                        apologyBtn.classList.add('show');
                    }, 1000);
                    
                    // Hentikan efek darah
                    document.querySelectorAll('.blood-drip').forEach(drip => {
                        drip.style.animation = 'none';
                    });
                }
            }, 1500);
        }
        
        // Event listener untuk tombol NEXT
        nextBtn.addEventListener('click', function() {
            // Jika sedang mengetik, selesaikan dulu
            if (isTyping) {
                const currentMessage = messages[currentMessageIndex];
                messageText.textContent = currentMessage;
                typingCursor.style.display = "none";
                isTyping = false;
                return;
            }
            
            fadeOutMessage();
            currentMessageIndex++;
            
            if (currentMessageIndex < messages.length) {
                setTimeout(() => {
                    messageContainer.classList.add('show');
                    nextBtn.classList.add('show');
                    typeText();
                    
                    // Reset tombol jika bukan pesan terakhir
                    if (currentMessageIndex < messages.length - 1) {
                        nextBtn.textContent = "NEXT";
                        nextBtn.classList.remove("glitch");
                    }
                }, 1600);
            }
        });
        
        // Efek glitch acak saat mendekati akhir
        setInterval(() => {
            if (currentMessageIndex >= messages.length - 2 && currentMessageIndex < messages.length) {
                const glitchChance = Math.random();
                
                if (glitchChance > 0.7) {
                    document.body.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                    
                    setTimeout(() => {
                        document.body.style.transform = "translate(0)";
                    }, 50);
                }
            }
        }, 300);
        
        // Tambahkan sound effect klik untuk tombol
        function playClickSound() {
            // Buat audio context untuk sound effect klik
            try {
                const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                oscillator.frequency.exponentialRampToValueAtTime(200, audioContext.currentTime + 0.1);
                
                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.1);
            } catch (e) {
                console.log("Sound effect tidak didukung:", e);
            }
        }
        
        // Tambahkan sound effect ke semua tombol
        document.querySelectorAll('button, a').forEach(element => {
            element.addEventListener('click', playClickSound);
        });
    </script>
</body>
</html>
